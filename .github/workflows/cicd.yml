name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only one deploy runs at a time; a second push cancels the previous
# in-flight run instead of racing it.
concurrency:
  group: fleet-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Quality gates (run on PRs and pushes, before anything is built) ──────────
      # 1. No third-party script CDNs. Scripts must be self-hosted (npm → public/build/vendor)
      #    so a CDN compromise can never run code inside a signed-in session.
      #    Allowed remote hosts: Google Maps + Firebase/Google auth only.
      - name: Gate - no third-party script CDNs
        run: |
          if grep -rnE '<script[^>]+src=["'"'"']https?://(cdn\.jsdelivr\.net|unpkg\.com|cdnjs\.cloudflare\.com|code\.jquery\.com|ajax\.googleapis\.com|stackpath\.bootstrapcdn\.com)' resources/views; then
            echo "::error::A view loads a script from a public CDN. Add the package to package.json and use @vendorScript() (see scripts/copy-vendor.mjs)."
            exit 1
          fi

      # 2. Every PHP file parses (catches a bad merge before the image is built).
      - name: Gate - PHP syntax
        run: |
          find app bootstrap config routes -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /tmp/lint.txt 2>&1 || { grep -v '^No syntax errors' /tmp/lint.txt; exit 1; }

      # 3. Dependency advisories — visible in the log, not blocking (a transitive
      #    advisory must never stop a security fix from shipping).
      - name: Report - npm audit (production deps)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build always runs, on both PRs and pushes to main — catches a
      # broken Dockerfile before merge.
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: shalotrack-fleet
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      # Push ONLY on a real push to main. A pull_request build never
      # reaches ECR — closes the "unmerged PR becomes production" gap
      # that exists in the other three repos' pipelines.
      - name: Push to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: shalotrack-fleet
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest