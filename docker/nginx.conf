# ShaloTrack Fleet — nginx (runs as www-data, non-root)
#
# Traffic path: Browser → Cloudflare (HTTPS) → ALB (HTTP :80) → EC2 :8080 → this nginx :8080 → PHP-FPM 127.0.0.1:9000

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;

    # Must be LONGER than the ALB idle timeout (60s) — otherwise nginx closes
    # keep-alive connections the ALB still thinks are open → random 502s.
    keepalive_timeout 75s;

    client_max_body_size 5m;

    # Slow-client defences (slowloris): a connection that dribbles its request holds a socket for ever.
    client_header_timeout 10s;
    client_body_timeout   15s;
    send_timeout          30s;
    reset_timedout_connection on;

    # The image never changes at runtime, so file lookups can be cached.
    open_file_cache          max=2000 inactive=60s;
    open_file_cache_valid    120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   off;

    # Non-root: all temp paths under /tmp.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # Real visitor IP comes from Cloudflare's CF-Connecting-IP header.
    log_format main '$http_cf_connecting_ip - [$time_local] "$request" '
                    '$status $body_bytes_sent $request_time '
                    '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    # ── Flood protection ──────────────────────────────────────────────────────────────────────────
    # PHP-FPM has only a few workers (see php-fpm.conf), so one noisy client must be stopped HERE,
    # before it can occupy them. Static assets are served by nginx and are not limited.
    # Key = the visitor's real IP from Cloudflare; if the header is missing (health checks, direct hits)
    # fall back to the connecting address.
    map $http_cf_connecting_ip $client_key {
        default $http_cf_connecting_ip;
        ""      $remote_addr;
    }
    limit_req_zone  $client_key zone=perip:10m rate=20r/s;   # sustained; a page load bursts ~25 requests
    limit_conn_zone $client_key zone=connperip:10m;
    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level  warn;
    limit_conn_log_level warn;

    # Browsers get a readable page, fetch()/AJAX callers get the same JSON shape the app uses.
    map $http_accept $rate_limited_page {
        default    json;
        "~*text/html" html;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    server {
        listen 8080 default_server;
        server_name _;

        root  /var/www/html/public;
        index index.php;
        charset utf-8;

        # Security headers. NOTE: do not use add_header inside any location
        # block below — nginx would then silently drop ALL of these for it.
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Health check (ALB + Docker HEALTHCHECK) — keep it out of the access log.
        location = /up {
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        # Vite assets are content-hashed → cache for a year.
        location /build/ {
            expires 1y;
            access_log off;
            try_files $uri =404;
        }

        # Vehicle icons are versioned by ?v= in the URL → cache for 30 days.
        location /vehicle-icons/ {
            expires 30d;
            access_log off;
            try_files $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Only the front controller may execute PHP.
        location = /index.php {
            # burst 60 absorbs a page load; beyond that the client gets a 429 instead of a worker.
            limit_req  zone=perip burst=60 nodelay;
            limit_conn connperip 20;
            error_page 429 = @rate_limited_$rate_limited_page;

            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            include /etc/nginx/fastcgi_params;

            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 60s;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
        }

        # 429 bodies. (add_header inside a location drops the server-level ones, so the needed ones are repeated.)
        location @rate_limited_json {
            internal;
            default_type application/json;
            add_header Retry-After 5 always;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 429 '{"success":false,"code":"RATE_LIMITED","message":"Too many requests. Please wait a few seconds and try again."}';
        }

        location @rate_limited_html {
            internal;
            default_type text/html;
            add_header Retry-After 5 always;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 429 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slow down a little - ShaloTrack</title></head><body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#021F4A;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:24px"><main><h1 style="margin:0 0 8px">Slow down a little</h1><p style="margin:0 0 20px;opacity:.85">Too many requests came from your connection in a short time.<br>Please wait a few seconds and try again.</p><a href="/dashboard" style="color:#FA6908;font-weight:700">Back to the dashboard</a></main></body></html>';
        }

        # Any other .php path → 404 (never executed, never downloaded).
        location ~ \.php$ {
            return 404;
        }

        # Block dotfiles (.env, .git, .htaccess …).
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}