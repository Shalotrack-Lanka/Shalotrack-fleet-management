# ShaloTrack Fleet — nginx (runs as www-data, non-root)
#
# Traffic path: Browser → Cloudflare (HTTPS) → ALB (HTTP :80) → EC2 :8080 → this nginx :8080 → PHP-FPM 127.0.0.1:9000

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;

    # Must be LONGER than the ALB idle timeout (60s) — otherwise nginx closes
    # keep-alive connections the ALB still thinks are open → random 502s.
    keepalive_timeout 75s;

    client_max_body_size 5m;

    # Non-root: all temp paths under /tmp.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # Real visitor IP comes from Cloudflare's CF-Connecting-IP header.
    log_format main '$http_cf_connecting_ip - [$time_local] "$request" '
                    '$status $body_bytes_sent $request_time '
                    '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    server {
        listen 8080 default_server;
        server_name _;

        root  /var/www/html/public;
        index index.php;
        charset utf-8;

        # Security headers. NOTE: do not use add_header inside any location
        # block below — nginx would then silently drop ALL of these for it.
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Health check (ALB + Docker HEALTHCHECK) — keep it out of the access log.
        location = /up {
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        # Vite assets are content-hashed → cache for a year.
        location /build/ {
            expires 1y;
            access_log off;
            try_files $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Only the front controller may execute PHP.
        location = /index.php {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            include /etc/nginx/fastcgi_params;

            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 60s;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
        }

        # Any other .php path → 404 (never executed, never downloaded).
        location ~ \.php$ {
            return 404;
        }

        # Block dotfiles (.env, .git, .htaccess …).
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}