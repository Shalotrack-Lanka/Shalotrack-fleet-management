; ShaloTrack Fleet — production PHP overrides (loaded after php.ini-production)

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

; DomPDF (Stats / Trip reports) is the heaviest request in this app.
memory_limit = 160M
max_execution_time = 60
upload_max_filesize = 4M
post_max_size = 5M

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache — code in the image never changes, so never re-check file timestamps.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = off