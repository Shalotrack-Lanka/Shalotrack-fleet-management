; ShaloTrack Fleet — PHP-FPM (runs as www-data, non-root)
;
; Sized for a t3.micro shared with the Admin portal:
;   ondemand → zero idle workers when nobody is using the portal (saves RAM)
;   max 4 workers × ~40 MB typical ≈ 160 MB under load

[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
; Loopback only — nginx is in the same container.
listen = 127.0.0.1:9000

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500

request_terminate_timeout = 60s

; Keep container env visible to workers (runtime config comes from docker -e).
clear_env = no

; Send worker stdout/stderr to the container log without FPM's prefix noise.
catch_workers_output = yes
decorate_workers_output = no