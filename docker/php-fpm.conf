; ShaloTrack Fleet — PHP-FPM (runs as www-data, non-root)
;
; Sized for a t3.micro shared with the Admin portal:
;   ondemand → zero idle workers when nobody is using the portal (saves RAM)
;   max 4 workers × ~40 MB typical ≈ 160 MB under load

[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
; Loopback only — nginx is in the same container.
listen = 127.0.0.1:9000

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500

request_terminate_timeout = 60s

; Keep container env visible to workers (runtime config comes from docker -e).
clear_env = no

; Defence in depth against RCE: web requests never need to spawn OS processes, so if an attacker ever
; reaches code execution inside a worker (PHP engine CVE, bad dependency), these cannot start a shell.
; php_admin_value cannot be overridden by ini_set(). Applies to FPM workers only; the CLI
; (`php artisan optimize` in entrypoint.sh) uses php.ini and is NOT affected.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

; Send worker stdout/stderr to the container log without FPM's prefix noise.
catch_workers_output = yes
decorate_workers_output = no